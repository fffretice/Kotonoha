name: Build and core checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build Apple Silicon application
        run: ./scripts/build.sh
      - name: Run core regression checks
        run: ./scripts/test.sh
      - name: Check comment language
        run: python3 scripts/check-comments.py
      - name: Verify app signature
        run: codesign --verify --deep --strict 'outputs/言叶 Kotonoha.app'
